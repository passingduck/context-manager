[workspace]
resolver = "3"
members = ["crates/cm-core", "crates/cm-host", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
cm-core = { path = "crates/cm-core" }
cm-host = { path = "crates/cm-host" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
sha2 = "0.11"
toml = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "io-util"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
subtle = "2"
getrandom = "0.4"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-build = "2"
tiktoken-rs = "0.12"
serde_yaml_ng = "0.10"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json", "preserve_order"] }
toml_edit = "0.25"
ignore = "0.4"
globset = "0.4"
trash = "5"
regex = "1"
libc = "0.2"

[profile.release]
lto = "thin"

# A scan hashes and tokenizes every byte it reads. The crates that do that run optimized in debug
# builds and tests, so that a test that bounds the time of a scan measures the scan's own work
# and not an unoptimized hash or tokenizer, which run ten to twenty times slower.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.tiktoken-rs]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.bstr]
opt-level = 3
