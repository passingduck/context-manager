[[rule]]
id = "codex.home"
en = "Codex CLI reads its user-level files from the directory in CODEX_HOME, and from .codex in the home directory when that variable is not set."
ko = "Codex CLI는 사용자 수준 파일을 CODEX_HOME 환경 변수가 가리키는 디렉터리에서 읽습니다. 이 변수가 없으면 홈 디렉터리의 .codex 디렉터리에서 읽습니다."
evidence = "docs/agents/codex.md section 6.1"

[[rule]]
id = "codex.agents_md.global"
en = "Codex reads one global instruction file from its home directory. It takes AGENTS.override.md when that file has text, and otherwise AGENTS.md. The text is trimmed, and no size limit applies."
ko = "Codex는 홈 디렉터리에서 전역 지침 파일을 하나만 읽습니다. AGENTS.override.md에 내용이 있으면 이 파일을 읽고, 내용이 없으면 AGENTS.md를 읽습니다. 앞뒤 공백은 잘라내고, 크기 제한은 없습니다."
evidence = "docs/agents/codex.md section 1.1 (global row); probe:C, probe:N"

[[rule]]
id = "codex.agents_md.project"
en = "Codex walks from the project root down to the working directory and reads one file per directory: AGENTS.override.md, then AGENTS.md, then the fallback names. An empty override still takes the directory. The files share one byte budget. The file that crosses it is cut at the byte, and every later file is dropped. An explicitly untrusted project skips all of them."
ko = "Codex는 프로젝트 루트에서 작업 디렉터리까지 내려오면서 디렉터리마다 파일을 하나만 읽습니다. 순서는 AGENTS.override.md, AGENTS.md, 대체 이름입니다. 내용이 빈 override 파일도 그 디렉터리의 자리를 차지합니다. 이 파일들은 바이트 예산 하나를 나눠 씁니다. 예산을 넘는 파일은 그 바이트에서 잘리고, 그다음 파일은 모두 버려집니다. 신뢰하지 않는다고 기록된 프로젝트에서는 이 파일을 모두 건너뜁니다."
evidence = "docs/agents/codex.md sections 1.1, 1.3, 1.5; probe:A, probe:B, probe:D, probe:E, probe:F"

[[rule]]
id = "codex.agents_md.below_cwd"
en = "Codex never loads AGENTS.md files below the working directory. The model can open them itself with its tools."
ko = "Codex는 작업 디렉터리 아래에 있는 AGENTS.md 파일을 자동으로 읽지 않습니다. 모델이 도구로 직접 열 수는 있습니다."
evidence = "docs/agents/codex.md section 1.1 (below cwd row); probe:A"

[[rule]]
id = "codex.config.model_instructions_file"
en = "The model_instructions_file key in config.toml replaces the built-in base instructions with the text of that file. The file must not be empty. A relative path resolves against the folder of the config layer."
ko = "config.toml의 model_instructions_file 키는 기본 지침을 이 파일의 내용으로 바꿉니다. 파일은 비어 있으면 안 됩니다. 상대 경로는 그 설정 계층의 폴더를 기준으로 해석합니다."
evidence = "docs/agents/codex.md sections 5.5, 6.2; probe:L"

[[rule]]
id = "codex.config.developer_instructions"
en = "The developer_instructions key in config.toml is sent as a developer message. A trusted project's .codex/config.toml may set it."
ko = "config.toml의 developer_instructions 키는 개발자 메시지로 전달됩니다. 신뢰하는 프로젝트의 .codex/config.toml에도 이 키를 둘 수 있습니다."
evidence = "docs/agents/codex.md section 5.5; probe:I"

[[rule]]
id = "codex.prompts.legacy"
en = "Custom prompts in the prompts directory of the Codex home are legacy. Codex 0.165.0 has no code that loads them."
ko = "Codex 홈의 prompts 디렉터리에 있는 사용자 정의 프롬프트는 이전 방식입니다. Codex 0.165.0에는 이 파일을 읽는 코드가 없습니다."
evidence = "docs/agents/codex.md section 5.2"

[[rule]]
id = "codex.skills.root.project"
en = "Skills in a project's .codex/skills or .agents/skills directory are listed for every trust level. Codex looks for .agents/skills in each directory from the project root down to the working directory, and never below it."
ko = "프로젝트의 .codex/skills 또는 .agents/skills 디렉터리에 있는 스킬은 목록에 올라갑니다. 프로젝트의 신뢰 상태와는 상관이 없습니다. Codex는 프로젝트 루트에서 작업 디렉터리까지 각 디렉터리의 .agents/skills를 찾고, 그 아래는 찾지 않습니다."
evidence = "docs/agents/codex.md section 5.1; probe:J"

[[rule]]
id = "codex.skills.root.user"
en = "Skills in the skills directory of the Codex home are listed. This location is deprecated but still works."
ko = "Codex 홈의 skills 디렉터리에 있는 스킬은 목록에 올라갑니다. 이 위치는 더 이상 권장하지 않지만 아직 동작합니다."
evidence = "docs/agents/codex.md section 5.1; probe:J"

[[rule]]
id = "codex.skills.root.agents"
en = "Skills in the .agents/skills directory of the home directory are listed for every project."
ko = "홈 디렉터리의 .agents/skills에 있는 스킬은 모든 프로젝트의 목록에 올라갑니다."
evidence = "docs/agents/codex.md section 5.1; probe:J"

[[rule]]
id = "codex.skills.root.system"
en = "Codex writes the bundled system skills into skills/.system itself at every start. Edits to them are overwritten."
ko = "Codex는 시작할 때마다 기본 제공 시스템 스킬을 skills/.system에 직접 씁니다. 이 파일을 고쳐도 다시 덮어써집니다."
evidence = "docs/agents/codex.md sections 5.1, 7.2"

[[rule]]
id = "codex.skills.root.admin"
en = "Skills in /etc/codex/skills are set by an administrator and are read only here."
ko = "/etc/codex/skills에 있는 스킬은 관리자가 정한 것이며 여기서는 읽기만 할 수 있습니다."
evidence = "docs/agents/codex.md section 5.1"

[[rule]]
id = "codex.skills.root.plugin"
en = "An enabled plugin contributes the skills of its active version. Their names start with the plugin name and a colon."
ko = "켜져 있는 플러그인은 활성 버전의 스킬을 제공합니다. 이 스킬의 이름은 플러그인 이름과 콜론으로 시작합니다."
evidence = "docs/agents/codex.md sections 5.1, 5.4"

[[rule]]
id = "codex.skills.disabled"
en = "A skills.config entry in the user config.toml turned this skill off, so Codex leaves it out of the catalog."
ko = "사용자 config.toml의 skills.config 항목이 이 스킬을 꺼 두었으므로 Codex는 목록에서 뺍니다."
evidence = "docs/agents/codex.md section 5.1 (Config)"

[[rule]]
id = "codex.skills.explicit_only"
en = "The agents/openai.yaml file of this skill forbids implicit use, so the skill is not in the catalog. It still loads when the user names it."
ko = "이 스킬의 agents/openai.yaml이 암시적 사용을 막고 있어서 목록에는 없습니다. 사용자가 이름을 직접 부르면 그때는 읽습니다."
evidence = "docs/agents/codex.md section 5.1; codex-rs/ext/skills/src/provider/host.rs (hidden_from_prompt)"

[[rule]]
id = "codex.skills.rejected"
en = "Codex rejected this skill. A SKILL.md needs YAML frontmatter between two lines of three dashes, a description, and a name of at most 64 characters."
ko = "Codex가 이 스킬을 거부했습니다. SKILL.md에는 대시 세 개로 이루어진 두 줄 사이의 YAML 머리말, 설명, 그리고 64자 이하의 이름이 있어야 합니다."
evidence = "docs/agents/codex.md section 5.1 (Loader rules); probe:J"

[[rule]]
id = "codex.agents.file"
en = "Each .toml file in an agents directory defines one subagent role. The role needs a description, and an unknown key rejects it. A project role loads only from a trusted project."
ko = "agents 디렉터리의 .toml 파일 하나가 서브에이전트 역할 하나를 정의합니다. 역할에는 설명이 있어야 하고, 알 수 없는 키가 있으면 거부됩니다. 프로젝트의 역할은 신뢰하는 프로젝트에서만 읽습니다."
evidence = "docs/agents/codex.md section 5.3"

[[rule]]
id = "codex.agents.config_entry"
en = "An [agents.name] table in config.toml defines a subagent role and may point to a file with config_file. A higher layer overrides a lower layer for the same name."
ko = "config.toml의 [agents.이름] 표는 서브에이전트 역할을 정의합니다. 이 표는 config_file로 파일을 가리킬 수 있습니다. 같은 이름이면 더 높은 계층이 낮은 계층을 덮어씁니다."
evidence = "docs/agents/codex.md section 5.3"

[[rule]]
id = "codex.agents.rejected"
en = "Codex skips this subagent role and prints a warning at start. The file does not parse, or it has no description."
ko = "Codex는 이 서브에이전트 역할을 건너뛰고 시작할 때 경고를 냅니다. 파일을 해석할 수 없거나 설명이 없기 때문입니다."
evidence = "docs/agents/codex.md section 5.3"

[[rule]]
id = "codex.agents.project_untrusted"
en = "This project has no trusted entry in the user config.toml, so Codex does not load its subagent roles."
ko = "이 프로젝트는 사용자 config.toml에 신뢰한다는 기록이 없어서 Codex가 서브에이전트 역할을 읽지 않습니다."
evidence = "docs/agents/codex.md section 6.3 (trust matrix)"

[[rule]]
id = "codex.memory.store"
en = "The memories directory holds generated memory. It is off by default, and Codex rewrites most of its files. Add a note in extensions/ad_hoc/notes instead of editing them."
ko = "memories 디렉터리에는 자동으로 만들어진 기억이 들어 있습니다. 기본값은 꺼짐이고, Codex가 대부분의 파일을 다시 씁니다. 파일을 직접 고치지 말고 extensions/ad_hoc/notes에 메모를 추가하세요."
evidence = "docs/agents/codex.md sections 3.1, 3.2, 7.2"

[[rule]]
id = "codex.memory.summary"
en = "memory_summary.md is the only memory file Codex sends on its own, and only when both the memories feature and use_memories are on. It is trimmed and cut at 2,500 tokens."
ko = "memory_summary.md는 Codex가 스스로 보내는 유일한 기억 파일입니다. Codex는 memories 기능과 use_memories가 모두 켜져 있을 때만 이 파일을 보냅니다. 앞뒤 공백을 자르고 2,500토큰에서 자릅니다."
evidence = "docs/agents/codex.md sections 3.1, 3.2"

[[rule]]
id = "codex.hooks.toggle_managed"
en = "An administrator manages this hook. It is always on, and this tool cannot switch it off."
ko = "이 훅은 관리자가 관리하며 항상 켜져 있습니다. 이 도구로 끌 수 없습니다."
evidence = "docs/agents/codex.md sections 2.1, 2.5"

[[rule]]
id = "codex.hooks.toggle_unsupported"
en = "Codex does not run this handler, so there is nothing to switch. Prompt and agent handlers are parsed and then skipped, and a handler with a bad matcher or empty field is skipped too."
ko = "Codex가 이 핸들러를 실행하지 않으므로 켜고 끌 대상이 없습니다. prompt와 agent 핸들러는 해석만 하고 건너뛰며, 매처가 잘못되었거나 비어 있는 필드가 있는 핸들러도 건너뜁니다."
evidence = "docs/agents/codex.md section 2.4; probe:hooks"

[[rule]]
id = "codex.hooks.run_mcp_unsupported"
en = "This tool can test only command hooks. An MCP tool hook needs a live MCP server."
ko = "이 도구로는 command 훅만 시험할 수 있습니다. MCP 도구 훅은 실행 중인 MCP 서버가 필요합니다."
evidence = "docs/agents/codex.md section 2.4"

[[rule]]
id = "codex.guard.trusted_hash"
en = "A trusted_hash or trusted_content_hash decides whether Codex runs a hook, so writing one would approve code for the user. Only the /hooks screen of Codex may write these values."
ko = "trusted_hash와 trusted_content_hash는 Codex가 훅을 실행할지 정하는 값입니다. 이 도구가 이 값을 쓰면 사용자 대신 코드를 승인하게 됩니다. 이 값은 Codex의 /hooks 화면에서만 쓸 수 있습니다."
evidence = "docs/agents/codex.md sections 2.5, 7.2"

[[rule]]
id = "codex.slot.global_instructions"
en = "AGENTS.md in the Codex home loads for every project. AGENTS.override.md in the same directory wins when it has text."
ko = "Codex 홈의 AGENTS.md는 모든 프로젝트에서 읽습니다. 같은 디렉터리의 AGENTS.override.md에 내용이 있으면 그 파일이 우선합니다."
evidence = "docs/agents/codex.md section 1.1"

[[rule]]
id = "codex.slot.project_instructions"
en = "AGENTS.md in this directory loads when it lies on the path from the project root to the working directory, within the shared 32 KiB budget."
ko = "Codex는 이 디렉터리의 AGENTS.md를 프로젝트 루트에서 작업 디렉터리로 가는 경로 위에 있을 때 읽습니다. 이 파일은 32KiB 예산을 다른 파일과 나눠 씁니다."
evidence = "docs/agents/codex.md sections 1.1, 1.3"

[[rule]]
id = "codex.slot.skill"
en = "A skill in a new directory with a SKILL.md file shows up in the catalog at the next session. It needs a description."
ko = "SKILL.md 파일이 들어 있는 새 디렉터리의 스킬은 다음 세션부터 목록에 나타납니다. 설명이 꼭 있어야 합니다."
evidence = "docs/agents/codex.md section 5.1"

[[rule]]
id = "codex.slot.subagent"
en = "A .toml file in the agents directory of the Codex home defines a subagent role at the next session."
ko = "Codex 홈의 agents 디렉터리에 둔 .toml 파일은 다음 세션부터 서브에이전트 역할이 됩니다."
evidence = "docs/agents/codex.md section 5.3"

[[rule]]
id = "codex.slot.subagent_project"
en = "A .toml file in this project's .codex/agents directory defines a subagent role, but only when the project is trusted."
ko = "이 프로젝트의 .codex/agents 디렉터리에 둔 .toml 파일은 서브에이전트 역할이 됩니다. 다만 Codex가 프로젝트를 신뢰할 때만 그렇습니다."
evidence = "docs/agents/codex.md sections 5.3, 6.3"

[[rule]]
id = "codex.slot.rule"
en = "A .rules file in the rules directory is a command policy for Codex. It is not an instruction. Codex also appends to default.rules itself."
ko = "rules 디렉터리의 .rules 파일은 Codex의 명령 정책이며 지침이 아닙니다. Codex도 default.rules에 직접 내용을 추가합니다."
evidence = "docs/agents/codex.md section 4"

[[rule]]
id = "codex.slot.memory_note"
en = "A Markdown note in extensions/ad_hoc/notes is the supported way to add a memory. The next consolidation applies it."
ko = "extensions/ad_hoc/notes에 둔 마크다운 메모가 기억을 추가하는 정식 방법입니다. 다음 통합 때 Codex가 이 메모를 반영합니다."
evidence = "docs/agents/codex.md section 3.2"

[[rule]]
id = "codex.assumption.context_window"
en = "The size of the skill catalog depends on the model's context window, which a scan cannot read. Set model_context_window or skills.max_context_tokens to pin it."
ko = "스킬 목록의 크기는 모델의 컨텍스트 창 크기에 따라 달라지는데, 검사로는 이 값을 알 수 없습니다. model_context_window나 skills.max_context_tokens를 설정하면 값이 고정됩니다."
evidence = "docs/agents/codex.md section 5.1"

[[rule]]
id = "codex.assumption.managed_sources"
en = "A scan cannot read managed preferences, the cloud bundle or session flags. Their settings may change what Codex loads."
ko = "검사로는 관리형 환경설정, 클라우드 설정 묶음, 세션 플래그를 읽을 수 없습니다. 이 설정들이 Codex가 읽는 내용을 바꿀 수 있습니다."
evidence = "docs/agents/codex.md section 6.2"

[[rule]]
id = "codex.assumption.plugin_hook_content"
en = "Codex also hashes the files of a plugin before it runs one of the plugin's hooks. This scan checks only the hook declaration for a large plugin, so the hook may still be marked as modified when Codex starts."
ko = "Codex는 플러그인의 훅을 실행하기 전에 플러그인 파일 전체의 해시도 확인합니다. 이 검사는 큰 플러그인에서 훅 선언만 확인하므로, Codex를 시작할 때 이 훅이 변경됨으로 표시될 수도 있습니다."
evidence = "docs/agents/codex.md section 2.5 (plugin hooks); codex-rs/hooks/src/engine/plugin_fingerprint.rs"

[[rule]]
id = "codex.assumption.plugin_marketplaces"
en = "Which marketplace plugins Codex keeps active depends on the login of the user and on marketplace data that a scan cannot read. This scan follows the [plugins] table and the plugin cache, so the list can differ from Codex."
ko = "Codex가 어떤 마켓플레이스 플러그인을 켜 두는지는 사용자의 로그인 상태와 검사로 읽을 수 없는 마켓플레이스 정보에 따라 달라집니다. 이 검사는 [plugins] 표와 플러그인 캐시를 따르므로 Codex가 보여 주는 목록과 다를 수 있습니다."
evidence = "docs/agents/codex.md section 5.4 (open question 6); codex-rs/core-plugins/src/loader.rs"

[[rule]]
id = "codex.edit.name"
en = "A new skill, subagent or rule needs a name of letters, digits, dashes, underscores and dots. The name has at most 64 characters and does not start with a dot."
ko = "새 스킬, 서브에이전트, 규칙에는 글자, 숫자, 대시, 밑줄, 점으로 이루어진 이름이 필요합니다. 이름은 64자 이하이고 점으로 시작하지 않습니다."
evidence = "docs/agents/codex.md sections 5.1, 5.3, 7.2"

[[rule]]
id = "codex.edit.collision"
en = "A file with this name already exists in the slot. Choose another name, or edit the existing file."
ko = "이 자리에 같은 이름의 파일이 이미 있습니다. 다른 이름을 고르거나 기존 파일을 고치세요."
evidence = "docs/design.md section 4"

[[rule]]
id = "codex.edit.slot"
en = "This slot cannot take a new item of that kind. A memory goes in as a note, and Codex has no command files."
ko = "이 자리에는 그 종류의 새 항목을 만들 수 없습니다. 기억은 메모로 추가하고, Codex에는 명령 파일이 없습니다."
evidence = "docs/agents/codex.md sections 3.2, 5.2"

[[rule]]
id = "codex.edit.store"
en = "Only the notes folder of the active memory store accepts a new entry. Codex rewrites every other memory file."
ko = "새 항목은 활성 기억 저장소의 notes 폴더에만 넣을 수 있습니다. 다른 기억 파일은 Codex가 다시 씁니다."
evidence = "docs/agents/codex.md sections 3.2, 7.2"

[[rule]]
id = "codex.edit.hook_event"
en = "Codex knows 14 hook events. This name is not one of them, so Codex would not run the hook."
ko = "Codex가 아는 훅 이벤트는 14개입니다. 이 이름은 그중 하나가 아니어서 Codex가 훅을 실행하지 않습니다."
evidence = "docs/agents/codex.md section 2.4"

[[rule]]
id = "codex.edit.hook_handler"
en = "Codex rejects the whole hook file when one handler has no type, an unknown type, or a field of the wrong type. A command handler needs a command string."
ko = "핸들러 하나라도 type이 없거나, 알 수 없는 type이거나, 필드의 형식이 맞지 않으면 Codex는 훅 파일 전체를 거부합니다. command 핸들러에는 command 문자열이 필요합니다."
evidence = "docs/agents/codex.md section 2.4"

[[rule]]
id = "codex.edit.hook_file"
en = "A hook can be added only to a hooks.json or config.toml file of an enabled Codex layer."
ko = "훅은 사용 중인 Codex 설정 계층의 hooks.json 또는 config.toml 파일에만 추가할 수 있습니다."
evidence = "docs/agents/codex.md sections 2.1, 7.2"

[[rule]]
id = "codex.edit.unreadable"
en = "The file does not have the shape of a Codex hook file, so this tool cannot change it without damaging it."
ko = "이 파일은 Codex 훅 파일의 형식이 아니어서, 이 도구가 고치면 파일이 망가질 수 있습니다."
evidence = "docs/agents/codex.md section 2.4"

[[rule]]
id = "codex.takes_effect.next_session"
en = "Codex reads this file when a session starts, so the new item loads in the next session."
ko = "Codex는 세션을 시작할 때 이 파일을 읽으므로 새 항목은 다음 세션부터 적용됩니다."
evidence = "docs/agents/codex.md sections 5.1, 5.3"

[[rule]]
id = "codex.takes_effect.hooks"
en = "Codex builds its hook engine when a thread starts. A running session may keep the old hooks until the next one."
ko = "Codex는 스레드를 시작할 때 훅 엔진을 만듭니다. 실행 중인 세션은 다음 세션이 시작될 때까지 이전 훅을 쓸 수 있습니다."
evidence = "docs/agents/codex.md section 2.5"

[[rule]]
id = "codex.takes_effect.memory_note"
en = "Codex applies a note the next time it consolidates its memories."
ko = "Codex는 다음에 기억을 통합할 때 이 메모를 반영합니다."
evidence = "docs/agents/codex.md section 3.2"

[[rule]]
id = "codex.takes_effect.memory_off"
en = "The memories feature is off, so Codex does not read this note until the feature is on."
ko = "memories 기능이 꺼져 있어서, 기능을 켤 때까지 Codex는 이 메모를 읽지 않습니다."
evidence = "docs/agents/codex.md sections 3.1, 3.2"
