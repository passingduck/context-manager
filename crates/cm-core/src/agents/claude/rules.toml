[[rule]]
id = "claude.home"
en = "Claude Code reads its user-level files from the directory in CLAUDE_CONFIG_DIR, and from .claude in the home directory when that variable is not set."
ko = "Claude Code는 사용자 수준 파일을 CLAUDE_CONFIG_DIR 환경 변수가 가리키는 디렉터리에서 읽고, 이 변수가 없으면 홈 디렉터리의 .claude 디렉터리에서 읽습니다."
evidence = "docs/agents/claude-code.md section 1.1"

[[rule]]
id = "claude.instructions.nested_worktree"
en = "The working directory is inside a nested worktree. For the directories above the worktree root but inside the main checkout, Claude Code reads only CLAUDE.local.md. It skips their CLAUDE.md files, because the worktree has its own copies."
ko = "작업 디렉터리가 중첩된 워크트리 안에 있습니다. 워크트리 루트 위에 있고 메인 체크아웃 안에 있는 디렉터리에서는 Claude Code가 CLAUDE.local.md만 읽습니다. 워크트리에 같은 파일의 사본이 있으므로 그 디렉터리의 CLAUDE.md는 읽지 않습니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED, RUN:wtnested)"

[[rule]]
id = "claude.access.managed_path_rule"
en = "A managed rule with a paths list loads when Claude Code reads, writes or edits a file that matches one of its patterns. The patterns are matched against the path relative to the session's working directory."
ko = "paths 목록이 있는 관리형 규칙은 Claude Code가 그 패턴에 맞는 파일을 읽거나 쓰거나 수정할 때 불러옵니다. 패턴은 세션의 작업 디렉터리를 기준으로 한 상대 경로에 대해 비교합니다."
evidence = "docs/agents/claude-code.md sections 1.3 and 1.4 (CONFIRMED, binary only for the managed directory)"

[[rule]]
id = "claude.access.user_path_rule"
en = "A user rule with a paths list loads when Claude Code touches a file that matches one of its patterns. The patterns are matched against the path relative to the session's working directory."
ko = "paths 목록이 있는 사용자 규칙은 Claude Code가 그 패턴에 맞는 파일을 다룰 때 불러옵니다. 패턴은 세션의 작업 디렉터리를 기준으로 한 상대 경로에 대해 비교합니다."
evidence = "docs/agents/claude-code.md sections 1.3 and 1.4 (CONFIRMED, RUN:lazy)"

[[rule]]
id = "claude.access.path_rule"
en = "A project rule with a paths list loads when Claude Code touches a file that matches one of its patterns. The patterns are matched against the path relative to the directory that holds the rule's .claude directory, and a trailing /** is dropped."
ko = "paths 목록이 있는 프로젝트 규칙은 Claude Code가 그 패턴에 맞는 파일을 다룰 때 불러옵니다. 패턴은 규칙이 든 .claude 디렉터리의 상위 디렉터리를 기준으로 한 상대 경로에 대해 비교하며, 끝의 /**는 떼어 냅니다."
evidence = "docs/agents/claude-code.md sections 1.3 and 1.4 (CONFIRMED, RUN:lazy)"

[[rule]]
id = "claude.access.nested_claude_md"
en = "A CLAUDE.md file below the working directory does not load at session start. Claude Code adds it the first time it reads, writes or edits a file under that directory, and cuts it at the on-demand character limit."
ko = "작업 디렉터리 아래에 있는 CLAUDE.md 파일은 세션을 시작할 때 불러오지 않습니다. Claude Code는 그 디렉터리 아래의 파일을 처음 읽거나 쓰거나 수정할 때 이 파일을 추가하며, 필요할 때 불러오는 글자 수 한도에서 잘라 냅니다."
evidence = "docs/agents/claude-code.md section 1.3 (CONFIRMED, RUN:base and RUN:lazy)"

[[rule]]
id = "claude.access.nested_local_md"
en = "A CLAUDE.local.md file below the working directory loads on demand, like a nested CLAUDE.md, and is cut at the same character limit."
ko = "작업 디렉터리 아래에 있는 CLAUDE.local.md 파일은 중첩된 CLAUDE.md와 같은 방식으로 필요할 때 불러오며, 같은 글자 수 한도에서 잘라 냅니다."
evidence = "docs/agents/claude-code.md sections 1.1 and 1.3 (CONFIRMED)"

[[rule]]
id = "claude.access.nested_rule"
en = "A rule without paths inside a nested .claude/rules directory loads on demand, together with the nested CLAUDE.md of that directory."
ko = "중첩된 .claude/rules 디렉터리에 있고 paths가 없는 규칙은 그 디렉터리의 CLAUDE.md와 함께 필요할 때 불러옵니다."
evidence = "docs/agents/claude-code.md section 1.3 (CONFIRMED, RUN:lazy: app/.claude/rules/d.md)"

[[rule]]
id = "claude.assumption.server_managed_policy"
en = "Server-managed policy is fetched by Claude Code and may add a claudeMd value or hooks that this scan cannot read before the first fetch, so the scan reports it as unknown."
ko = "서버가 관리하는 정책은 Claude Code가 가져오며 claudeMd 값이나 훅을 더할 수 있습니다. 첫 번째로 가져오기 전에는 이 스캔이 읽을 수 없으므로 알 수 없음으로 표시합니다."
evidence = "docs/agents/claude-code.md section 6.1, last paragraph, and open question H7"

[[rule]]
id = "claude.assumption.mdm_policy"
en = "Managed policy delivered through MDM or the Windows registry is not stored in a plain file, so the scan cannot read it and reports it as unknown."
ko = "MDM이나 Windows 레지스트리로 전달되는 관리 정책은 일반 파일에 저장되지 않으므로 이 스캔이 읽을 수 없고 알 수 없음으로 표시합니다."
evidence = "docs/agents/claude-code.md sections 5.2 and 6.1"

[[rule]]
id = "claude.assumption.feature_flags"
en = "Claude Code feature flags decide some behavior at run time and are not stored in a file, so the scan reports them as unknown."
ko = "Claude Code의 기능 플래그는 실행할 때 일부 동작을 정하며 파일에 저장되지 않으므로 이 스캔은 알 수 없음으로 표시합니다."
evidence = "docs/agents/claude-code.md section 6.1, last paragraph"

[[rule]]
id = "claude.assumption.mcp_instructions"
en = "An MCP server can send instructions when it connects. They come from the running server, so the scan cannot see them and reports them as unknown."
ko = "MCP 서버는 연결할 때 지침을 보낼 수 있습니다. 이 지침은 실행 중인 서버에서 오므로 이 스캔이 볼 수 없고 알 수 없음으로 표시합니다."
evidence = "docs/agents/claude-code.md section 6.1, last paragraph"

[[rule]]
id = "claude.assumption.synced_skills"
en = "Skills synced from claude.ai appear on disk only after Claude Code downloads them, so the scan reports the ones it cannot see as unknown."
ko = "claude.ai에서 동기화하는 스킬은 Claude Code가 내려받은 뒤에야 디스크에 나타나므로, 이 스캔이 볼 수 없는 스킬은 알 수 없음으로 표시합니다."
evidence = "docs/agents/claude-code.md section 6.1, last paragraph, and open question E14"

[[rule]]
id = "claude.discovery.managed_claude_md"
en = "The CLAUDE.md in the managed directory loads first of all files. It cannot be excluded and is never cut to the on-demand limit. It does not load when instruction files are switched off."
ko = "관리 디렉터리의 CLAUDE.md는 모든 파일 가운데 가장 먼저 불러옵니다. 제외할 수 없고 필요할 때 불러오는 한도로 자르지도 않습니다. 지침 파일을 끄면 불러오지 않습니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED, binary only; no managed directory exists on the research machine)"

[[rule]]
id = "claude.discovery.managed_setting"
en = "The claudeMd string in managed settings loads right after the managed CLAUDE.md. The server-managed value comes first and the policy value second. Claude Code shows it under the name <managed-settings>."
ko = "관리 설정의 claudeMd 문자열은 관리형 CLAUDE.md 바로 뒤에 불러옵니다. 서버가 관리하는 값이 먼저고 정책 값이 그다음입니다. Claude Code는 이 내용을 <managed-settings>라는 이름으로 보여 줍니다."
evidence = "docs/agents/claude-code.md sections 1.1 and 1.2 (CONFIRMED, binary and docs)"

[[rule]]
id = "claude.discovery.managed_rules"
en = "A rule without paths in the managed .claude/rules directory loads at session start, after the managed CLAUDE.md. This location is not in the documentation."
ko = "관리 디렉터리의 .claude/rules에 있고 paths가 없는 규칙은 관리형 CLAUDE.md 다음에 세션을 시작할 때 불러옵니다. 이 위치는 공식 문서에 나오지 않습니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED, binary only)"

[[rule]]
id = "claude.discovery.user_claude_md"
en = "The CLAUDE.md in the user's Claude Code directory loads after the managed files and before every project file. Its imports never need approval."
ko = "사용자의 Claude Code 디렉터리에 있는 CLAUDE.md는 관리형 파일 다음, 모든 프로젝트 파일 앞에 불러옵니다. 이 파일의 가져오기에는 승인이 필요하지 않습니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED, RUN:base)"

[[rule]]
id = "claude.discovery.user_rules"
en = "A rule without paths under the user's rules directory loads after the user CLAUDE.md, before every project rule. Subdirectories are scanned too."
ko = "사용자 rules 디렉터리에 있고 paths가 없는 규칙은 사용자 CLAUDE.md 다음, 모든 프로젝트 규칙 앞에 불러옵니다. 하위 디렉터리도 찾아봅니다."
evidence = "docs/agents/claude-code.md sections 1.1 and 1.4 (CONFIRMED, RUN:base)"

[[rule]]
id = "claude.discovery.project_claude_md"
en = "Claude Code walks from the filesystem root down to the working directory, below the root itself, and loads CLAUDE.md in each directory it passes. The walk does not stop at the git root or the home directory."
ko = "Claude Code는 파일 시스템 루트 바로 아래부터 작업 디렉터리까지 내려오며 지나는 디렉터리마다 CLAUDE.md를 불러옵니다. 이 탐색은 git 루트나 홈 디렉터리에서 멈추지 않습니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED, RUN:base and RUN:fromrepo)"

[[rule]]
id = "claude.discovery.project_dotclaude_md"
en = "The .claude/CLAUDE.md file of each directory on the walk loads right after that directory's CLAUDE.md."
ko = "탐색에서 지나는 각 디렉터리의 .claude/CLAUDE.md 파일은 그 디렉터리의 CLAUDE.md 바로 뒤에 불러옵니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED, RUN:base)"

[[rule]]
id = "claude.discovery.project_rules"
en = "A rule without paths under .claude/rules in each directory on the walk loads after that directory's CLAUDE.md files. Only files ending in .md count. Inside one directory the real order is the file system order, and this tool lists them sorted by path."
ko = "탐색에서 지나는 각 디렉터리의 .claude/rules에 있고 paths가 없는 규칙은 그 디렉터리의 CLAUDE.md 파일들 다음에 불러옵니다. 이름이 .md로 끝나는 파일만 해당합니다. 한 디렉터리 안의 실제 순서는 파일 시스템 순서이고, 이 도구는 경로 순서로 보여 줍니다."
evidence = "docs/agents/claude-code.md sections 1.2 and 1.4 (CONFIRMED, RUN:base)"

[[rule]]
id = "claude.discovery.local_claude_md"
en = "The CLAUDE.local.md file of each directory on the walk loads last of that directory's files. It holds private instructions that are not checked in."
ko = "탐색에서 지나는 각 디렉터리의 CLAUDE.local.md 파일은 그 디렉터리의 파일 가운데 마지막에 불러옵니다. 저장소에 올리지 않는 개인 지침이 들어 있습니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED, RUN:base)"

[[rule]]
id = "claude.discovery.agents_md"
en = "AGENTS.md and .claude/AGENTS.md load for a directory according to the instructionFiles mode. In the default mode they load only when no CLAUDE.md, .claude/CLAUDE.md or CLAUDE.local.md exists in the working directory or any parent. They come after that directory's rules."
ko = "AGENTS.md와 .claude/AGENTS.md는 instructionFiles 모드에 따라 불러옵니다. 기본 모드에서는 작업 디렉터리와 그 상위 디렉터리에 CLAUDE.md, .claude/CLAUDE.md, CLAUDE.local.md가 하나도 없을 때만 불러옵니다. 해당 디렉터리의 규칙 다음에 옵니다."
evidence = "docs/agents/claude-code.md section 1.6 (CONFIRMED, RUN:agents and RUN:base). The place relative to CLAUDE.local.md in the and mode is UNVERIFIED"

[[rule]]
id = "claude.discovery.memory_index"
en = "The MEMORY.md file of the project's auto memory directory loads last at session start, as part of the same reminder. Claude Code keeps whole lines up to 200 lines and 25,000 characters and never expands imports in it."
ko = "프로젝트 자동 메모리 디렉터리의 MEMORY.md 파일은 세션을 시작할 때 같은 알림의 일부로 가장 마지막에 불러옵니다. Claude Code는 200줄과 25,000자까지 온전한 줄만 남기며 이 파일의 가져오기는 펼치지 않습니다."
evidence = "docs/agents/claude-code.md sections 1.2, 2.1 and 2.4 (CONFIRMED, RUN:base and RUN:bytes)"

[[rule]]
id = "claude.discovery.memory_topic"
en = "A topic file in the auto memory directory is not loaded at session start. Claude reads it with its file tools when it decides to, usually after finding it in MEMORY.md."
ko = "자동 메모리 디렉터리의 주제 파일은 세션을 시작할 때 불러오지 않습니다. Claude가 필요하다고 판단할 때 파일 도구로 읽으며, 보통 MEMORY.md에서 찾은 뒤에 읽습니다."
evidence = "docs/agents/claude-code.md section 2.1 (CONFIRMED, RUN:base)"

[[rule]]
id = "claude.memory.auto"
en = "The auto memory of a project is one directory shared by every subdirectory and every worktree of the repository. Its name comes from the main repository root, with every character outside letters and digits replaced by a dash."
ko = "프로젝트의 자동 메모리는 저장소의 모든 하위 디렉터리와 모든 워크트리가 함께 쓰는 디렉터리 하나입니다. 이름은 메인 저장소 루트에서 만들며, 영문자와 숫자가 아닌 글자는 모두 대시로 바꿉니다."
evidence = "docs/agents/claude-code.md sections 2.1 to 2.3 (CONFIRMED, RUN:base, RUN:worktree and RUN:longkey)"

[[rule]]
id = "claude.memory.agent_user"
en = "A subagent whose memory is user keeps its own MEMORY.md under the agent-memory directory of the user's Claude Code directory. It loads into that subagent's prompt when the subagent starts."
ko = "memory가 user인 서브에이전트는 사용자 Claude Code 디렉터리의 agent-memory 아래에 자기만의 MEMORY.md를 둡니다. 서브에이전트가 시작할 때 이 파일이 그 서브에이전트의 프롬프트로 들어갑니다."
evidence = "docs/agents/claude-code.md section 2.5 (CONFIRMED, binary; not run end to end)"

[[rule]]
id = "claude.memory.agent_project"
en = "A subagent whose memory is project keeps its own MEMORY.md under .claude/agent-memory in the session's working directory, not in the git root."
ko = "memory가 project인 서브에이전트는 git 루트가 아니라 세션의 작업 디렉터리 아래 .claude/agent-memory에 자기만의 MEMORY.md를 둡니다."
evidence = "docs/agents/claude-code.md section 2.5 (CONFIRMED, binary; not run end to end)"

[[rule]]
id = "claude.memory.agent_local"
en = "A subagent whose memory is local keeps its own MEMORY.md under .claude/agent-memory-local in the session's working directory. It is meant to stay out of version control."
ko = "memory가 local인 서브에이전트는 세션의 작업 디렉터리 아래 .claude/agent-memory-local에 자기만의 MEMORY.md를 둡니다. 이 파일은 버전 관리에 올리지 않는 용도입니다."
evidence = "docs/agents/claude-code.md section 2.5 (CONFIRMED, binary; not run end to end)"

[[rule]]
id = "claude.guard.managed"
en = "Files in the managed directory belong to an administrator. This tool shows them and never writes them."
ko = "관리 디렉터리의 파일은 관리자의 것입니다. 이 도구는 그 파일을 보여 주기만 하고 쓰지 않습니다."
evidence = "docs/agents/claude-code.md section 6.2, last row"

[[rule]]
id = "claude.guard.claude_json"
en = "The .claude.json file is the application's own state and Claude Code rewrites it often. This tool reads its keys and never writes it."
ko = "파일 .claude.json은 애플리케이션 자체의 상태이며 Claude Code가 자주 다시 씁니다. 이 도구는 키만 읽고 이 파일에는 쓰지 않습니다."
evidence = "docs/agents/claude-code.md sections 5.2 and 6.2"

[[rule]]
id = "claude.guard.remote_settings"
en = "The remote-settings.json file is a cache of server-managed settings. Only Claude Code writes it, so this tool never does."
ko = "remote-settings.json 파일은 서버가 관리하는 설정의 캐시입니다. 이 파일은 Claude Code만 쓰므로 이 도구는 쓰지 않습니다."
evidence = "docs/agents/claude-code.md sections 5.2 and 6.2"

[[rule]]
id = "claude.guard.plugin_cache"
en = "Plugin files in the cache and the marketplaces directory are overwritten when a plugin updates, so this tool never writes them."
ko = "캐시와 마켓플레이스 디렉터리에 있는 플러그인 파일은 플러그인을 업데이트할 때 덮어쓰이므로 이 도구는 쓰지 않습니다."
evidence = "docs/agents/claude-code.md sections 4 and 6.2"

[[rule]]
id = "claude.guard.synced"
en = "Files under synced directories come from claude.ai and are replaced by the next sync, so this tool never writes them."
ko = "동기화 디렉터리 아래의 파일은 claude.ai에서 오며 다음 동기화에서 바뀌므로 이 도구는 쓰지 않습니다."
evidence = "docs/agents/claude-code.md sections 4 and 6.2"

[[rule]]
id = "claude.guard.settings_not_json"
en = "Claude Code settings files are strict JSON, with no comments and no trailing commas. A file that does not parse makes Claude Code skip it or stop, so this tool refuses to save one."
ko = "Claude Code 설정 파일은 주석과 끝 쉼표를 허용하지 않는 엄격한 JSON입니다. 해석되지 않는 파일은 Claude Code가 건너뛰거나 멈추므로 이 도구는 그런 파일을 저장하지 않습니다."
evidence = "docs/agents/claude-code.md section 6.2 (CONFIRMED)"

[[rule]]
id = "claude.guard.rule_frontmatter"
en = "A rule whose frontmatter does not parse can silently never load, so this tool refuses a save that newly breaks the frontmatter. Quote any glob that starts with an asterisk, a brace or a bracket."
ko = "프론트매터가 해석되지 않는 규칙은 조용히 불러오지 않을 수 있으므로, 이 도구는 프론트매터를 새로 망가뜨리는 저장을 막습니다. 별표, 중괄호, 대괄호로 시작하는 글롭은 따옴표로 묶으세요."
evidence = "docs/agents/claude-code.md sections 1.4 and 6.2 (the general case is UNVERIFIED, open question 1)"

[[rule]]
id = "claude.slot.project_claude_md"
en = "CLAUDE.md in the working directory is a project instruction file. It loads at session start for sessions started there or in any directory below it."
ko = "작업 디렉터리의 CLAUDE.md는 프로젝트 지침 파일입니다. 그 디렉터리나 그 아래 디렉터리에서 시작하는 세션에서 세션을 시작할 때 불러옵니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED)"

[[rule]]
id = "claude.slot.project_dotclaude_md"
en = ".claude/CLAUDE.md in the working directory is a project instruction file that loads right after CLAUDE.md of the same directory."
ko = "작업 디렉터리의 .claude/CLAUDE.md는 같은 디렉터리의 CLAUDE.md 바로 뒤에 불러오는 프로젝트 지침 파일입니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED)"

[[rule]]
id = "claude.slot.local_claude_md"
en = "CLAUDE.local.md in the working directory holds private instructions that are not checked in. It loads last of that directory's files. Add it to .gitignore."
ko = "작업 디렉터리의 CLAUDE.local.md에는 저장소에 올리지 않는 개인 지침을 둡니다. 그 디렉터리의 파일 가운데 마지막에 불러옵니다. .gitignore에 추가하세요."
evidence = "docs/agents/claude-code.md sections 1.1 and 6.2 (CONFIRMED)"

[[rule]]
id = "claude.slot.user_claude_md"
en = "CLAUDE.md in the user's Claude Code directory applies to every project and loads before the project files."
ko = "사용자의 Claude Code 디렉터리에 있는 CLAUDE.md는 모든 프로젝트에 적용되며 프로젝트 파일보다 먼저 불러옵니다."
evidence = "docs/agents/claude-code.md section 1.1 (CONFIRMED)"

[[rule]]
id = "claude.slot.project_rule"
en = "A new rule file in .claude/rules of the working directory loads at session start when it has no paths, and on demand when it has paths."
ko = "작업 디렉터리의 .claude/rules에 만든 새 규칙 파일은 paths가 없으면 세션을 시작할 때, paths가 있으면 필요할 때 불러옵니다."
evidence = "docs/agents/claude-code.md section 1.4 (CONFIRMED)"

[[rule]]
id = "claude.slot.user_rule"
en = "A new rule file in the user's rules directory applies to every project. Without paths it loads at session start, before every project rule."
ko = "사용자 rules 디렉터리에 만든 새 규칙 파일은 모든 프로젝트에 적용됩니다. paths가 없으면 세션을 시작할 때 모든 프로젝트 규칙보다 먼저 불러옵니다."
evidence = "docs/agents/claude-code.md sections 1.1 and 1.4 (CONFIRMED)"

[[rule]]
id = "claude.slot.project_skill"
en = "A new skill directory under .claude/skills of the working directory holds a SKILL.md file. Its description is always listed and its body loads when the skill is invoked."
ko = "작업 디렉터리의 .claude/skills 아래에 만든 새 스킬 디렉터리에는 SKILL.md 파일이 있습니다. 설명은 항상 목록에 들어가고 본문은 스킬을 호출할 때 불러옵니다."
evidence = "docs/agents/claude-code.md section 4 (CONFIRMED)"

[[rule]]
id = "claude.slot.user_skill"
en = "A new skill directory under the user's skills directory is available in every project."
ko = "사용자 skills 디렉터리 아래에 만든 새 스킬 디렉터리는 모든 프로젝트에서 쓸 수 있습니다."
evidence = "docs/agents/claude-code.md section 4 (CONFIRMED)"

[[rule]]
id = "claude.slot.project_command"
en = "A new Markdown file in .claude/commands of the working directory becomes a slash command of the project."
ko = "작업 디렉터리의 .claude/commands에 만든 새 Markdown 파일은 그 프로젝트의 슬래시 명령이 됩니다."
evidence = "docs/agents/claude-code.md section 4 (CONFIRMED)"

[[rule]]
id = "claude.slot.user_command"
en = "A new Markdown file in the user's commands directory becomes a slash command in every project."
ko = "사용자 commands 디렉터리에 만든 새 Markdown 파일은 모든 프로젝트의 슬래시 명령이 됩니다."
evidence = "docs/agents/claude-code.md section 4 (CONFIRMED)"

[[rule]]
id = "claude.slot.project_subagent"
en = "A new Markdown file in .claude/agents of the working directory defines a subagent of the project."
ko = "작업 디렉터리의 .claude/agents에 만든 새 Markdown 파일은 그 프로젝트의 서브에이전트를 정의합니다."
evidence = "docs/agents/claude-code.md section 4 (CONFIRMED)"

[[rule]]
id = "claude.slot.user_subagent"
en = "A new Markdown file in the user's agents directory defines a subagent for every project."
ko = "사용자 agents 디렉터리에 만든 새 Markdown 파일은 모든 프로젝트에서 쓸 서브에이전트를 정의합니다."
evidence = "docs/agents/claude-code.md section 4 (CONFIRMED)"

[[rule]]
id = "claude.slot.memory_topic"
en = "A new topic file in the auto memory directory is read on demand. Add one index line for it to MEMORY.md, or Claude will rarely find it."
ko = "자동 메모리 디렉터리에 만든 새 주제 파일은 필요할 때 읽습니다. MEMORY.md에 이 파일을 가리키는 색인 줄을 하나 더하세요. 그러지 않으면 Claude가 거의 찾지 못합니다."
evidence = "docs/agents/claude-code.md sections 2.6 and 6.2 (CONFIRMED)"
