\* Finding: file b has a second hard link, so the tool writes it in place. The process dies
\* after the truncate, and b is left half written. A revert of the unfinished record finds b
\* at neither state, leaves it as a conflict, and still marks the record aborted (Ctx::apply,
\* a revert of an unfinished record).
\* expect: AbortedMeansNothing
SPECIFICATION Spec

