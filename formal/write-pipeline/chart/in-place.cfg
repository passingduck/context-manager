\* The chart of one instance whose file b has a second hard link, so the tool writes b in
\* place: a save, then a revert, with one failed file operation.
SPECIFICATION Spec

CONSTANTS
    Procs = {p1}
    MaxIds = 2
    MaxCrashes = 0
    MaxFailures = 1
    MaxOutside = 0
    Lock = TRUE
    InPlace = {"b"}
    EditInWindow = FALSE
    ChartScript = TRUE
    RollForward = FALSE
    ExecuteBeforeJournal = FALSE
    SkipUndo = FALSE
    SealBeforeLastOp = FALSE
    RevertKeepsTarget = FALSE
    TornUnreported = FALSE

INVARIANTS
    TypeOK
    RecoveryWritesNoAgentFile
    NoLateWrite
    ReplacedTextKept
    SealedMeansDone
    AbortedMeansNothing
    UndisturbedApplySeals
    RevertRestoresAndCloses
