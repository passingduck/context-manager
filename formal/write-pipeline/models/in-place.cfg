\* expect: pass
\* The model with a second hard link to file b, so the tool writes b in place and a through
\* a temp file and a rename. AbortedMeansNothing is left out: findings/in-place-torn.cfg
\* shows how a failed in-place write breaks it. Every other rule must hold.
SPECIFICATION Spec

CONSTANTS
    Procs = {p1, p2}
    MaxIds = 2
    MaxCrashes = 1
    MaxFailures = 1
    MaxOutside = 2
    Lock = TRUE
    InPlace = {"b"}
    EditInWindow = FALSE
    ChartScript = FALSE
    RollForward = FALSE
    ExecuteBeforeJournal = FALSE
    SkipUndo = FALSE
    SealBeforeLastOp = FALSE
    RevertKeepsTarget = FALSE

INVARIANTS
    TypeOK
    RecoveryWritesNoAgentFile
    NoLateWrite
    ReplacedTextKept
    SealedMeansDone
    UndisturbedApplySeals
    RevertRestoresAndCloses

SYMMETRY Symmetry
