\* expect: pass
\* The in-place model without a crash, so every rule is checked for a failed in-place write
\* and its undo. findings/in-place-crash-revert.cfg shows the break a crash adds.
\* not exercised: Crash RecoveryLock
SPECIFICATION Spec

CONSTANTS
    Procs = {p1, p2}
    MaxIds = 2
    MaxCrashes = 0
    MaxFailures = 1
    MaxOutside = 2
    Lock = TRUE
    InPlace = {"b"}
    EditInWindow = FALSE
    ChartScript = FALSE
    RollForward = FALSE
    ExecuteBeforeJournal = FALSE
    SkipUndo = FALSE
    SealBeforeLastOp = FALSE
    RevertKeepsTarget = FALSE
    TornUnreported = FALSE

INVARIANTS
    TypeOK
    RecoveryWritesNoAgentFile
    NoLateWrite
    ReplacedTextKept
    SealedMeansDone
    AbortedMeansNothing
    UndisturbedApplySeals
    RevertRestoresAndCloses

SYMMETRY Symmetry
