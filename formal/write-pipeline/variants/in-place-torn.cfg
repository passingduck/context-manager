\* Variant: file b has a second hard link, so the tool writes it in place, which is not
\* atomic (design section 4, step 4). write_in_place does not return that it truncated the
\* file before its write failed, so Ctx::undo takes the half-written file as one the failed
\* operation never touched, and aborts the record. This was the finding in-place-torn.
\* expect: AbortedMeansNothing
SPECIFICATION Spec

CONSTANTS
    Procs = {p1, p2}
    MaxIds = 2
    MaxCrashes = 1
    MaxFailures = 1
    MaxOutside = 2
    Lock = TRUE
    InPlace = {"b"}
    EditInWindow = FALSE
    ChartScript = FALSE
    RollForward = FALSE
    ExecuteBeforeJournal = FALSE
    SkipUndo = FALSE
    SealBeforeLastOp = FALSE
    RevertKeepsTarget = FALSE
    TornUnreported = TRUE

INVARIANT AbortedMeansNothing

SYMMETRY Symmetry
